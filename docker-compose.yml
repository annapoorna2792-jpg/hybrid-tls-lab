services:
  dashboard:
    build: ./dashboard
    ports:
      - "8000:8000"
    environment:
      DATABASE_PATH: /data/benchmark.db
    volumes:
      - benchmark-data:/data
    restart: unless-stopped

  classical-tls:
    image: hybrid-tls-lab-openssl:local
    build: ./tls
    command:
      - /opt/tls/bin/tls_server
      - --port
      - "4433"
      - --group
      - X25519
      - --mode
      - classical
      - --cert
      - /opt/tls/certs/server.crt
      - --key
      - /opt/tls/certs/server.key
      - --dashboard-host
      - dashboard
      - --dashboard-port
      - "8000"
    ports:
      - "4433:4433"
    depends_on:
      dashboard:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "printf 'GET /health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' | openssl s_client -connect 127.0.0.1:4433 -tls1_3 -groups X25519 -CAfile /opt/tls/certs/server.crt -verify_hostname localhost -quiet >/dev/null 2>&1"]
      interval: 10s
      timeout: 4s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  hybrid-tls:
    image: hybrid-tls-lab-openssl:local
    build: ./tls
    command:
      - /opt/tls/bin/tls_server
      - --port
      - "4434"
      - --group
      - X25519MLKEM768
      - --mode
      - hybrid
      - --cert
      - /opt/tls/certs/server.crt
      - --key
      - /opt/tls/certs/server.key
      - --dashboard-host
      - dashboard
      - --dashboard-port
      - "8000"
    ports:
      - "4434:4434"
    depends_on:
      dashboard:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "printf 'GET /health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' | openssl s_client -connect 127.0.0.1:4434 -tls1_3 -groups X25519MLKEM768 -CAfile /opt/tls/certs/server.crt -verify_hostname localhost -quiet >/dev/null 2>&1"]
      interval: 10s
      timeout: 4s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  benchmark-client:
    image: hybrid-tls-lab-openssl:local
    build: ./tls
    profiles: ["tools"]
    entrypoint: ["/opt/tls/bin/benchmark-entrypoint"]
    environment:
      CLASSICAL_HOST: classical-tls
      CLASSICAL_PORT: "4433"
      HYBRID_HOST: hybrid-tls
      HYBRID_PORT: "4434"
      DASHBOARD_HOST: dashboard
      DASHBOARD_PORT: "8000"
      ITERATIONS: "${ITERATIONS:-100}"
      WARMUP: "${WARMUP:-10}"
    depends_on:
      dashboard:
        condition: service_healthy
      classical-tls:
        condition: service_healthy
      hybrid-tls:
        condition: service_healthy

volumes:
  benchmark-data:

