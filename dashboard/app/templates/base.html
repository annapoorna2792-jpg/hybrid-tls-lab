<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} · Hybrid TLS Performance Lab</title>
  <link rel="stylesheet" href="/static/dashboard.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark">⧉</span>
        <span class="brand-name">PQ Readiness Lab</span>
      </div>
      <nav>
        <a href="/" class="{{ 'active' if active_nav == 'overview' else '' }}">
          <span class="nav-num">0</span> Overview
        </a>
        <a href="/scanner" class="{{ 'active' if active_nav == 'scanner' else '' }}">
          <span class="nav-num">1</span> Scanner
        </a>
        <a href="/benchmark" class="{{ 'active' if active_nav == 'benchmark' else '' }}">
          <span class="nav-num">2</span> Crypto Engine
        </a>
        <a href="/score" class="{{ 'active' if active_nav == 'score' else '' }}">
          <span class="nav-num">5</span> Risk Score
        </a>
        <a href="/score?view=queue" class="{{ 'active' if active_nav == 'remediation' else '' }}">
          <span class="nav-num">6</span> Remediation
        </a>
        <a href="/migration-cost" class="{{ 'active' if active_nav == 'migration' else '' }}">
          <span class="nav-num">7</span> Migration Cost
        </a>
        <a href="/docs" class="{{ 'active' if active_nav == 'docs' else '' }}">
          <span class="nav-num">§</span> Docs
        </a>
        <div style="padding:14px 20px 6px;color:var(--text-dim);font-size:11px;text-transform:uppercase;letter-spacing:0.06em;">Governance</div>
        <a href="/hndl" class="{{ 'active' if active_nav == 'hndl' else '' }}">
          <span class="nav-num">5</span> HNDL Exposure
        </a>
        <a href="/compliance" class="{{ 'active' if active_nav == 'compliance' else '' }}">
          <span class="nav-num">6</span> Compliance
        </a>
        <a href="/roadmap" class="{{ 'active' if active_nav == 'roadmap' else '' }}">
          <span class="nav-num">7</span> Roadmap
        </a>
      </nav>
      <div class="sidebar-foot">
        <a href="/api/results.csv">Export CSV</a>
      </div>
    </aside>
    <main class="content">
      {% block content %}{% endblock %}
    </main>
  </div>

  <script id="initial-data" type="application/json">{{ initial | tojson }}</script>
  <script id="qvi-data" type="application/json">{{ qvi | tojson }}</script>
  {% block scripts %}{% endblock %}
</body>
</html>
